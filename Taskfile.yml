version: "3"

vars:
  DEV_WORKFLOW_DIR: dev-tools-package/agents/_development-workflow
  OBSERVABILITY_DIR: dev-tools-package/agents/_observability
  PRODUCTION_OPS_DIR: dev-tools-package/agents/_production-ops
  SYSTEM_ARCH_DIR: dev-tools-package/agents/_system-architect

tasks:
  tests:unit:
    desc: Run all unit tests in app/tests/unit
    cmds:
      - npx vitest run app/tests/unit

  tests:integration:
    desc: Run all integration tests in app/tests/integration
    cmds:
      - npx vitest run app/tests/integration

  tests:e2e:
    desc: Run all E2E tests in app/tests/e2e
    cmds:
      - npx playwright test app/tests/e2e

  tests:full:
    desc: Run all tests (unit, integration, E2E)
    deps:
      - tests:unit
      - tests:integration
      - tests:e2e

  agents:reports:sync:
    desc: Sync agent reports for all profiles
    cmds:
      - task -d {{.DEV_WORKFLOW_DIR}} reports:sync
      - task -d {{.OBSERVABILITY_DIR}} reports:sync
      - task -d {{.PRODUCTION_OPS_DIR}} reports:sync
      - task -d {{.SYSTEM_ARCH_DIR}} reports:sync

  agents:reports:clean:
    desc: Clean agent report directories for all profiles
    cmds:
      - task -d {{.DEV_WORKFLOW_DIR}} reports:clean
      - task -d {{.OBSERVABILITY_DIR}} reports:clean
      - task -d {{.PRODUCTION_OPS_DIR}} reports:clean
      - task -d {{.SYSTEM_ARCH_DIR}} reports:clean

  agents:env:validate:
    desc: Ensure each agent profile has the required environment file
    cmds:
      - task -d {{.DEV_WORKFLOW_DIR}} env:validate
      - task -d {{.OBSERVABILITY_DIR}} env:validate
      - task -d {{.PRODUCTION_OPS_DIR}} env:validate
      - task -d {{.SYSTEM_ARCH_DIR}} env:validate

  agents:provenance:refresh:
    desc: Refresh inventories and sync agent reports
    cmds:
      - npm run docs:update
      - task: agents:reports:sync

  submodule:check:
    desc: "Verify dev-tools-package submodule is current and properly initialized"
    cmds:
      - |
        if [ -f .gitmodules ]; then
          echo "✓ Checking submodule status..."
          git submodule status dev-tools-package
          if git submodule status dev-tools-package | grep -q '^+'; then
            echo "⚠️  Dev-Tools submodule is out of sync with committed version"
            echo "Run: task submodule:update"
            exit 1
          elif git submodule status dev-tools-package | grep -q '^-'; then
            echo "⚠️  Dev-Tools submodule is not initialized"
            echo "Run: git submodule update --init --recursive"
            exit 1
          else
            echo "✓ Dev-Tools submodule is current"
          fi
        else
          echo "ℹ️  No submodules configured (using workspace copy)"
          if [ ! -d dev-tools-package ]; then
            echo "❌ dev-tools-package directory not found"
            exit 1
          fi
          echo "✓ dev-tools-package workspace directory exists"
        fi
    silent: false

  submodule:update:
    desc: "Update dev-tools-package submodule to latest from remote"
    cmds:
      - |
        if [ ! -f .gitmodules ]; then
          echo "❌ No submodules configured. Cannot update."
          echo "This command is only available after submodule migration."
          exit 1
        fi
        echo "Updating dev-tools-package submodule..."
        git submodule update --remote dev-tools-package
        git add dev-tools-package
        echo "✓ Submodule updated. Commit the change to lock the new version."
    silent: false

  submodule:init:
    desc: "Initialize dev-tools-package submodule (for new clones)"
    cmds:
      - |
        if [ ! -f .gitmodules ]; then
          echo "❌ No submodules configured."
          exit 1
        fi
        echo "Initializing submodules..."
        git submodule update --init --recursive
        echo "✓ Submodules initialized"
    silent: false
