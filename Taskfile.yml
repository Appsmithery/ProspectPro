version: "3"

vars:
  DEV_WORKFLOW_DIR: dev-tools-package/agents/_development-workflow
  OBSERVABILITY_DIR: dev-tools-package/agents/_observability
  PRODUCTION_OPS_DIR: dev-tools-package/agents/_production-ops
  SYSTEM_ARCH_DIR: dev-tools-package/agents/_system-architect

tasks:
  tests:unit:
    desc: Run all unit tests in app/tests/unit
    cmds:
      - npx vitest run app/tests/unit

  tests:integration:
    desc: Run all integration tests in app/tests/integration
    cmds:
      - npx vitest run app/tests/integration

  tests:e2e:
    desc: Run all E2E tests in app/tests/e2e
    cmds:
      - npx playwright test app/tests/e2e

  tests:full:
    desc: Run all tests (unit, integration, E2E)
    deps:
      - tests:unit
      - tests:integration
      - tests:e2e

  agents:reports:sync:
    desc: Sync agent reports for all profiles
    cmds:
      - task -d {{.DEV_WORKFLOW_DIR}} reports:sync
      - task -d {{.OBSERVABILITY_DIR}} reports:sync
      - task -d {{.PRODUCTION_OPS_DIR}} reports:sync
      - task -d {{.SYSTEM_ARCH_DIR}} reports:sync

  agents:reports:clean:
    desc: Clean agent report directories for all profiles
    cmds:
      - task -d {{.DEV_WORKFLOW_DIR}} reports:clean
      - task -d {{.OBSERVABILITY_DIR}} reports:clean
      - task -d {{.PRODUCTION_OPS_DIR}} reports:clean
      - task -d {{.SYSTEM_ARCH_DIR}} reports:clean

  agents:env:validate:
    desc: Ensure each agent profile has the required environment file
    cmds:
      - task -d {{.DEV_WORKFLOW_DIR}} env:validate
      - task -d {{.OBSERVABILITY_DIR}} env:validate
      - task -d {{.PRODUCTION_OPS_DIR}} env:validate
      - task -d {{.SYSTEM_ARCH_DIR}} env:validate

  agents:provenance:refresh:
    desc: Refresh inventories and sync agent reports
    cmds:
      - npm run docs:update
      - task: agents:reports:sync

  submodule:check:
    desc: Check dev-tools-package submodule status and ensure it's up to date
    cmds:
      - git submodule status
      - |
        echo "Checking dev-tools-package submodule..."
        cd dev-tools-package && git fetch origin prospect-pro-tools 2>/dev/null || true
        LOCAL=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        REMOTE=$(git rev-parse origin/prospect-pro-tools 2>/dev/null || echo "unknown")
        if [ "$LOCAL" != "$REMOTE" ] && [ "$REMOTE" != "unknown" ]; then
          echo "⚠️  Submodule is behind remote. Run: task submodule:update"
        else
          echo "✅ Submodule is up to date"
        fi

  submodule:update:
    desc: Update dev-tools-package submodule to latest commit on prospect-pro-tools branch
    cmds:
      - git submodule update --remote --merge dev-tools-package
      - |
        echo "✅ Submodule updated. Review changes with: cd dev-tools-package && git log -1"
        echo "If satisfied, commit with: git add dev-tools-package && git commit -m 'chore: Update dev-tools-package submodule'"

  submodule:init:
    desc: Initialize and update dev-tools-package submodule (run after clone)
    cmds:
      - git submodule update --init --recursive dev-tools-package
      - echo "✅ Submodule initialized"

  submodule:validate:
    desc: Run comprehensive validation of dev-tools-package submodule integration
    cmds:
      - bash dev-tools-package/scripts/automation/validate-submodule-integration.sh
