version: "3"

# Shared helper tasks for agent taskfiles. Expecting including taskfiles to provide
# the following vars (relative to the including taskfile unless otherwise noted):
#   ROOT_DIR        – repository root (default ../../.. from agent directory)
#   REPORTS_DIR     – path where the agent writes transient reports
#   REPORTS_DEST    – canonical reports directory under dev-tools/reports/agents/
#   HIGHLIGHT_DIR   – path to dev-tools/observability/highlight-node
#   ENV_FILE        – path to dev-tools/agents/.env.agent.local
#   AGENT_ID        – short identifier used for logging

vars:
  ROOT_DIR: "../../.."
  REPORTS_DIR: "../../testing/reports"
  REPORTS_DEST: "../../reports/agents"
  HIGHLIGHT_DIR: "../../observability/highlight-node"
  ENV_FILE: "../.env.agent.local"
  AGENT_ID: "agent"

tasks:
  init:highlight:
    desc: Build the shared Highlight Node helper used by agent workflows
    dir: "{{.HIGHLIGHT_DIR}}"
    cmds:
      - npm install --no-fund --no-audit
      - npm run build

  env:validate:
    desc: Ensure the consolidated agent environment file exists
    cmds:
      - node -e "const fs=require('fs');const path=require('path');const file=path.resolve('{{.ENV_FILE}}');if(!fs.existsSync(file)){fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,'# Placeholder for agent secrets. Hydrate with hydrate-local-env.sh or Vercel CLI.\n');console.warn('Created placeholder env file at '+file);}else{console.log('Agent env file present at '+file);}"

  scripts:clean:
    desc: Clear the agent-specific testing reports directory
    cmds:
      - node -e "const fs=require('fs');const path=require('path');const dir=path.resolve('{{.REPORTS_DIR}}');if(fs.existsSync(dir)){fs.rmSync(dir,{recursive:true,force:true});console.log('Removed reports dir '+dir);}fs.mkdirSync(dir,{recursive:true});"

  scripts:sync-reports:
    desc: Sync agent reports into the canonical dev-tools/reports/agents tree
    cmds:
      - node -e "const fs=require('fs');const path=require('path');const src=path.resolve('{{.REPORTS_DIR}}');const dest=path.resolve('{{.REPORTS_DEST}}');if(!fs.existsSync(src)){console.warn('No reports found at '+src);process.exit(0);}fs.mkdirSync(dest,{recursive:true});for(const entry of fs.readdirSync(src)){const from=path.join(src,entry);const to=path.join(dest,entry);fs.cpSync(from,to,{recursive:true});}console.log('Synced reports for {{.AGENT_ID}} to '+dest);"

  reports:sync:
    desc: Sync reports via the shared helper
    cmds:
      - task: scripts:sync-reports
