    deps:
      - tests:unit
      - tests:integration
      - tests:e2e
version: "3"
vars:
  VITEST_CONFIG: ./configs/vitest.agents.config.ts
  PLAYWRIGHT_CONFIG: ./configs/playwright.agents.config.ts
  REPORTS_DIR: ./reports

tasks:
  tests:unit:
    desc: Run all unit tests in app/tests/unit (Vitest)
    cmds:
      - npx vitest run ../../app/tests/unit

  tests:integration:
    desc: Run all integration tests in app/tests/integration (Vitest)
    cmds:
      - npx vitest run ../../app/tests/integration

  tests:e2e:
    desc: Run all E2E tests in app/tests/e2e (Playwright)
    cmds:
      - npx playwright test ../../app/tests/e2e

  tests:full:
    desc: Run all tests (unit, integration, E2E)
    deps:
      - tests:unit
      - tests:integration
      - tests:e2e

  agents:test:watch:
    desc: Watch all agent unit/integration tests (Vitest)
    cmds:
      - npx vitest --config {{.VITEST_CONFIG}} watch

  agents:test:coverage:
    desc: Generate coverage report for all agent tests
    cmds:
      - npx vitest --config {{.VITEST_CONFIG}} run --coverage
    generates:
      - "{{.REPORTS_DIR}}/coverage/*"

      - "{{.REPORTS_DIR}}/*"
version: "3"
vars:
  VITEST_CONFIG: ./configs/vitest.agents.config.ts
  PLAYWRIGHT_CONFIG: ./configs/playwright.agents.config.ts
  REPORTS_DIR: ./reports


  agents:test:full:
    desc: Run all agent tests (unit, integration, e2e)
    deps:
      - tests:unit
      - tests:integration
      - tests:e2e
  reports:open:
    desc: Open Playwright HTML report
    cmds:
      - npx playwright show-report {{.REPORTS_DIR}}/playwright
  reports_sync:
    desc: Sync all agent reports to dev-tools/reports
    cmds:
      - rsync -a ./reports/ ../../reports/

  provenance_refresh:
    desc: Refresh provenance and inventory files (docs:update, inventories)
    cmds:
      - npm run docs:update
      - echo "Provenance and inventories refreshed."

  scaffold_tests:
    desc: Scaffold missing test files and directories
    cmds:
      - node ../scripts/testing/scaffold-tests.mjs

# Synchronize all agent reports to canonical reports directory
# Per-agent Taskfiles should be placed in dev-tools/testing/agents/<agent>/Taskfile.yml
